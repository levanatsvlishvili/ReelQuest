name: "Frontend CI (React)"

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-and-lint:
    name: "Build & Verify Frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Build & Lint"
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm run build
          else
            echo "package.json not yet created in frontend directory. Skipping until Step 5 implementation."
          fi
