<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="64" height="64" rx="16" fill="#0B0D13" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />

  <!-- Outer Film Reel -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Film Spool Holes -->
  <circle cx="32" cy="18" r="3" fill="url(#goldGrad)" />
  <circle cx="44" cy="25" r="3" fill="url(#goldGrad)" />
  <circle cx="44" cy="39" r="3" fill="url(#goldGrad)" />
  <circle cx="32" cy="46" r="3" fill="url(#goldGrad)" />
  <circle cx="20" cy="39" r="3" fill="url(#goldGrad)" />
  <circle cx="20" cy="25" r="3" fill="url(#goldGrad)" />

  <!-- Center Hub with Cinematic Play Triangle -->
  <circle cx="32" cy="32" r="7" fill="#131722" stroke="url(#goldGrad)" stroke-width="1.5" />
  <polygon points="30,27 38,32 30,37" fill="url(#goldGrad)" />
</svg>
