<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="reelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="spindleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <mask id="reelMask">
      <!-- White reveals, Black cuts out -->
      <rect width="64" height="64" fill="white" />
      <!-- Center Spindle Hole -->
      <circle cx="32" cy="32" r="4" fill="black" />
      <!-- 5 Authentic Cinema Spool Cutouts -->
      <circle cx="32" cy="15.5" r="5" fill="black" />
      <circle cx="47.7" cy="26.9" r="5" fill="black" />
      <circle cx="41.7" cy="45.3" r="5" fill="black" />
      <circle cx="22.3" cy="45.3" r="5" fill="black" />
      <circle cx="16.3" cy="26.9" r="5" fill="black" />
    </mask>
  </defs>

  <!-- Solid Golden Reel Disc with transparent cutouts -->
  <circle cx="32" cy="32" r="28" fill="url(#reelGold)" mask="url(#reelMask)" />

  <!-- Outer Flange Raised Rim -->
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#reelGold)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#FDE68A" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="2.5 2.5" />

  <!-- Raised Spindle Collar -->
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="url(#spindleGold)" stroke-width="2" />
</svg>
